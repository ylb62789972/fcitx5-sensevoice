name: Android CI
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - name: Record candidate provenance
        run: |
          mkdir -p audit
          printf 'Commit: %s\nRun: %s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > audit/provenance.txt
          printf '%s\n' 'DEBUG TEST BUILD, not a production release.' 'A clean ClamAV scan and valid signature do not guarantee safety or resolve Chrome Safe Browsing warnings.' 'Do not disable or bypass browser or phone protections. If blocked, stop and investigate.' 'Debug signing identity may differ from the installed version. Do not uninstall the old app without backing up local data.' > audit/LIMITATIONS.txt
      - name: Validate and apply feature patch
        run: |
          set -o pipefail
          python3 -m py_compile scripts/apply-eg-upgrade.py
          python3 scripts/apply-eg-upgrade.py 2>&1 | tee audit/patch.log
          git diff -- app > audit/applied-source.diff
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: jetbrains
          java-version: 25.0.2
      - uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669
        with:
          validate-wrappers: true
          cache-provider: basic
      - name: Prepare inputs
        run: |
          set -o pipefail
          ./scripts/prepare-local-asr.sh 2>&1 | tee audit/asr-inputs.log
          ./scripts/prepare-legal-assets.sh
      - name: Build candidate
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug --stacktrace 2>&1 | tee audit/build.log
          ./gradlew --no-daemon :app:dependencies --configuration debugRuntimeClasspath > audit/dependencies.txt 2>&1
      - name: Verify signature and final permissions
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK"
          TOOLS=$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          sha256sum "$APK" > audit/apk-sha256.txt
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" > audit/signature.txt 2>&1
          "$TOOLS/aapt" dump permissions "$APK" > audit/permissions.txt
          "$TOOLS/aapt" dump badging "$APK" > audit/package.txt
          "$TOOLS/aapt" dump xmltree "$APK" AndroidManifest.xml > audit/final-manifest.txt
          unzip -l "$APK" > audit/apk-file-list.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('audit/permissions.txt').read_text()
          requested = set(re.findall(r"uses-permission[^:]*: name='([^']+)'", text))
          allowed = {'android.permission.RECORD_AUDIO', 'com.fcitx5sensevoice.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION'}
          unexpected = requested - allowed
          Path('audit/permission-gate.txt').write_text('Requested permissions: ' + repr(sorted(requested)) + '\nUnexpected permissions: ' + repr(sorted(unexpected)))
          if 'android.permission.RECORD_AUDIO' not in requested or unexpected:
              raise SystemExit('Permission verification failed; no APK download will be produced.')
          PY
      - name: Run unit tests
        id: tests
        run: |
          set -uo pipefail
          set +e
          ./gradlew --no-daemon testDebugUnitTest --stacktrace 2>&1 | tee audit/tests.log
          codes=("${PIPESTATUS[@]}")
          set -e
          printf 'Gradle exit: %s\nLog writer exit: %s\n' "${codes[0]}" "${codes[1]}" > audit/test-gate.txt
          if (( codes[0] != 0 || codes[1] != 0 )); then
            echo 'NOT PASSED: unit test task or log capture failed.' >> audit/test-gate.txt
            exit 1
          fi
          echo 'Gradle unit test task completed successfully; see XML reports for test counts.' >> audit/test-gate.txt
      - name: Update scanner definitions
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clamav
          sudo systemctl stop clamav-freshclam.service || true
          sudo freshclam 2>&1 | tee audit/scanner-update.log
          clamscan --version > audit/scanner-version.txt
      - name: Scan and reject incomplete results
        id: scan
        timeout-minutes: 20
        env:
          LC_ALL: C
        run: |
          set -uo pipefail
          printf '%s\n' 'bytecode enabled; mode ForceJIT; timeout 120000ms; per-file limit 600000ms; no rules disabled' > audit/scan-options.txt
          set +e
          clamscan --bytecode=yes --bytecode-mode=ForceJIT --bytecode-timeout=120000 --max-scantime=600000 --scan-archive=yes --alert-exceeds-max=yes --max-filesize=1024M --max-scansize=2048M --max-recursion=30 app/build/outputs/apk/debug/app-debug.apk 2>&1 | tee audit/clamav.txt
          codes=("${PIPESTATUS[@]}")
          set -e
          printf 'ClamAV exit: %s\nLog writer exit: %s\n' "${codes[0]}" "${codes[1]}" > audit/scan-gate.txt
          if (( codes[0] != 0 || codes[1] != 0 )); then
            echo 'NOT PASSED: scanner or log capture failed.' >> audit/scan-gate.txt
            exit 1
          fi
          if grep -Ein 'warning|timed out|timeout|exceeded|failed to run|error|skipp|not scanned|Heuristics\.Limits' audit/clamav.txt > audit/scan-warnings.txt; then
            echo 'NOT PASSED: warning or incomplete scan.' >> audit/scan-gate.txt
            exit 1
          fi
          if ! grep -Eq '^Infected files: *0 *$' audit/clamav.txt; then
            echo 'NOT PASSED: expected scan summary missing.' >> audit/scan-gate.txt
            exit 1
          fi
          if ! grep -Eq '^Scanned files: *[1-9][0-9]* *$' audit/clamav.txt; then
            echo 'NOT PASSED: no positive scanned-file count.' >> audit/scan-gate.txt
            exit 1
          fi
          echo 'Scanner completion gate passed. Not a guarantee of safety or a Google verdict.' >> audit/scan-gate.txt
      - name: Package exact checked candidate
        run: |
          set -euo pipefail
          sha256sum --check audit/apk-sha256.txt
          mkdir -p test-download
          cp app/build/outputs/apk/debug/app-debug.apk test-download/
          cp audit/signature.txt audit/scan-gate.txt audit/scan-options.txt audit/clamav.txt audit/test-gate.txt audit/permission-gate.txt audit/provenance.txt audit/LIMITATIONS.txt test-download/
          cd test-download
          sha256sum app-debug.apk > SHA256SUMS.txt
      - name: Offer checked test APK for download
        id: apk
        uses: actions/upload-artifact@v4
        with:
          name: EuropeanGate-Offline-AI-Keyboard-APK
          path: test-download/
          if-no-files-found: error
          retention-days: 7
      - name: Summarize results
        if: always()
        env:
          AUDIT_STATUS: ${{ job.status }}
          TEST_STATUS: ${{ steps.tests.outcome }}
          SCAN_STATUS: ${{ steps.scan.outcome }}
          APK_DOWNLOAD: ${{ steps.apk.outputs.artifact-url }}
        run: |
          printf '## APK test candidate\n\nCommit: `%s`\n\nStatus: %s\n\nUnit test step: %s\n\nAPK scan step: %s\n\nThis remains a Debug test build. Checks do not remove or overrule Chrome warnings. Do not disable security protections.\n' "$GITHUB_SHA" "$AUDIT_STATUS" "$TEST_STATUS" "$SCAN_STATUS" >> "$GITHUB_STEP_SUMMARY"
          if test -n "$APK_DOWNLOAD"; then printf '\n[Test APK and verification files](%s)\n' "$APK_DOWNLOAD" >> "$GITHUB_STEP_SUMMARY"; fi
          for f in permission-gate.txt test-gate.txt scan-options.txt scan-gate.txt scan-warnings.txt apk-sha256.txt; do
            if test -f "audit/$f"; then printf '\n### %s\n\n```text\n' "$f" >> "$GITHUB_STEP_SUMMARY"; cat "audit/$f" >> "$GITHUB_STEP_SUMMARY"; printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"; fi
          done
          if test "$TEST_STATUS" = failure && test -f audit/tests.log; then
            printf '\n### Unit test failure log (last 100 lines)\n\n```text\n' >> "$GITHUB_STEP_SUMMARY"
            tail -n 100 audit/tests.log >> "$GITHUB_STEP_SUMMARY"
            printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f audit/clamav.txt; then
            printf '\n### APK scan log (last 60 lines)\n\n```text\n' >> "$GITHUB_STEP_SUMMARY"
            tail -n 60 audit/clamav.txt >> "$GITHUB_STEP_SUMMARY"
            printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EG-security-audit
          path: |
            audit/
            app/build/test-results/
            app/build/reports/tests/
          if-no-files-found: error
          retention-days: 14
