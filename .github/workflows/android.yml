name: Android CI
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - name: Apply reviewed EG upgrade
        run: python3 scripts/apply-eg-upgrade.py
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: jetbrains
          java-version: 25.0.2
      - uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669
        with:
          validate-wrappers: true
          cache-provider: basic
      - run: ./scripts/prepare-local-asr.sh
      - run: ./scripts/prepare-legal-assets.sh
      - name: Assemble Debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug --stacktrace 2>&1 | tee build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EG-build-log
          path: build.log
          if-no-files-found: ignore
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: EuropeanGate-Offline-AI-Keyboard-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
