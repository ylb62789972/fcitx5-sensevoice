name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Set up JBR 25
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: jetbrains
          java-version: 25.0.2

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0
        with:
          validate-wrappers: true
          cache-provider: basic

      - name: Prepare pinned local ASR inputs
        run: ./scripts/prepare-local-asr.sh

      - name: Prepare legal assets
        run: ./scripts/prepare-legal-assets.sh

      - name: Assemble Debug APK
        run: |
          if ! ./gradlew --no-daemon assembleDebug --stacktrace > build.log 2>&1; then
            echo "### Gradle Build Error Log" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "e: |FAILURE:|What went wrong|Caused by:" -A 5 build.log | head -n 80 >> $GITHUB_STEP_SUMMARY || true
            echo "--- Tail of build.log ---" >> $GITHUB_STEP_SUMMARY
            tail -n 80 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat build.log
            exit 1
          fi
          cat build.log

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EuropeanGate-Offline-AI-Keyboard-APK
          path: app/build/outputs/apk/debug/app-debug.apk
